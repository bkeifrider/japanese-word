.kicker{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:900}
.mainchar{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(68px,21vw,112px);line-height:.95;margin-top:50px;text-shadow:0 7px 30px #0009}

.example{margin-top:25px;padding-top:16px;border-top:1px solid #ffffff2b}.jp{font-size:18px}.en{font-size:14px;color:var(--muted);margin-top:5px}

button{font:inherit}.voice button,.action button,.flash-btn,.mode-btn,.submit{border:0;border-radius:13px;padding:12px 7px;background:#fff;color:#171922;font-size:12px;font-weight:900;min-height:46px}.voice button.active{background:var(--accent);color:#241923;outline:2px solid #fff;outline-offset:1px}

<div class="app">
  <div class="top"><div class="brand">日本語 • DAILY</div><div class="theme" id="themeName"></div></div>

  <div class="nav">
    <button id="navWords" class="active" onclick="setSection('words')">Words</button>
    <button id="navHira" onclick="setSection('hiragana')">ひらがな</button>
    <button id="navKata" onclick="setSection('katakana')">カタカナ</button>
    <button id="navFlash" onclick="setSection('flash')">Flashcards</button>
  </div>

  <section id="learnCard" class="card"><div class="scene" id="scene" aria-hidden="true"></div>
    <div class="motif" id="motif"></div>
    <div class="kicker" id="category"></div>
    <div class="mainchar" id="mainchar"></div>
    <div class="subchar" id="subchar"></div>
    <div class="roman" id="roman"></div>
    <div class="meaning" id="meaning"></div>
    <div class="example"><div class="jp" id="example"></div><div class="en" id="exampleEn"></div></div>

    <div class="voice-title">PRONUNCIATION</div>
    <div class="voice">
      <button class="active" data-mode="regular" onclick="speak('regular')">Normal</button>
      <button data-mode="slow" onclick="speak('slow')">½ Speed</button>
      <button data-mode="syllable" onclick="speak('syllable')">Syllable</button>
    </div>
    <div class="actions">
      <button onclick="nextLearning()">Next</button>
      <button onclick="speak(currentVoice)">🔊 Hear again</button>
    </div>
    <div class="selectbox">
      <label>WORD ROTATION</label>
      <select id="interval" onchange="saveSettings()">
        <option value="1">Every hour</option><option value="2">Every 2 hours</option>
        <option value="4" selected>Every 4 hours</option><option value="6">Every 6 hours</option><option value="12">Every 12 hours</option>
      </select>
    </div>
    <div class="bottom"><button onclick="openStats()">📊 My progress</button></div>
  </section>

  <section id="flashCard" class="card flash hidden"></section>
  <div class="small-note">Themes, vocabulary, and progress stay on this device.</div>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target.id==='modal')closeStats()">
  <div class="sheet"><button class="close" onclick="closeStats()">×</button><h2>My progress</h2><p id="statsText"></p><div id="statsList"></div></div>
</div>

function themeApply(){
 const t=themes[themeIndex%themes.length],r=document.documentElement;
 r.style.setProperty("--bg",t[2]);r.style.setProperty("--bg2",t[3]);r.style.setProperty("--card",t[3]);
 r.style.setProperty("--accent",t[4]);r.style.setProperty("--accent2",t[5]);r.style.setProperty("--glow",t[4]+"66");
 r.style.setProperty("--scene",`radial-gradient(circle at 85% 20%,${t[4]}55 0 2px,transparent 3px),radial-gradient(circle at 15% 70%,${t[5]}44 0 3px,transparent 4px)`);
 document.getElementById("themeName").textContent=t[1]+" "+t[0];
 document.getElementById("motif").textContent=t[1];document.getElementById("scene").innerHTML=sceneSvg(themeIndex%themes.length);
}
function setSection(s){
 section=s;
 ["navWords","navHira","navKata","navFlash"].forEach(id=>document.getElementById(id).classList.remove("active"));
 document.getElementById(s==="words"?"navWords":s==="hiragana"?"navHira":s==="katakana"?"navKata":"navFlash").classList.add("active");
 document.getElementById("learnCard").classList.toggle("hidden",s==="flash");
 document.getElementById("flashCard").classList.toggle("hidden",s!=="flash");
 if(s==="flash")renderFlash(); else renderLearn();
}
function renderLearn(){
 const card=document.getElementById("learnCard");card.classList.remove("fade");void card.offsetWidth;card.classList.add("fade");themeApply();
 let item,sub,rom,meaning,ex,en,cat;
 if(section==="words"){let w=words[index%words.length];item=w[0];sub=w[1];rom=w[2];meaning=w[3];ex=w[4];en=w[5];cat=w[6]}
 else {let arr=section==="hiragana"?hira:kata,w=arr[index%arr.length];item=w[0];sub=w[1];rom=w[1];meaning=section==="hiragana"?"Hiragana character":"Katakana character";ex=`${w[0]} = ${w[1]}`;en="Say the sound aloud.";cat=section.toUpperCase()}
 document.getElementById("category").textContent=cat;document.getElementById("mainchar").textContent=item;document.getElementById("subchar").textContent=section==="words"?sub:"Romaji: "+sub;
 document.getElementById("roman").textContent=section==="words"?rom:"Japanese syllabary";
 document.getElementById("meaning").textContent=meaning;document.getElementById("example").textContent=ex;document.getElementById("exampleEn").textContent=en;
 document.querySelectorAll(".voice button").forEach(b=>b.classList.toggle("active",b.dataset.mode===currentVoice));
 localStorage.jwIndex=index;localStorage.jwLast=Date.now();
}
function nextLearning(){index++;themeIndex++;renderLearn()}
function saveSettings(){hours=+document.getElementById("interval").value;localStorage.jwHours=hours}
function speak(mode){
 currentVoice=mode;localStorage.jwVoice=mode;
 document.querySelectorAll(".voice button").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
 let text=section==="words"?words[index%words.length][1]:(section==="hiragana"?hira[index%hira.length][0]:kata[index%kata.length][0]);
 speechSynthesis.cancel();
 if(mode==="syllable"){
  [...text].forEach((ch,i)=>setTimeout(()=>{let u=new SpeechSynthesisUtterance(ch);u.lang="ja-JP";u.rate=.55;speechSynthesis.speak(u)},i*650));
 }else{let u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=mode==="slow"?.45:.9;speechSynthesis.speak(u)}
}
function auto(){if(section!=="flash"&&Date.now()-Number(localStorage.jwLast||0)>=hours*3600000)nextLearning()}

function flashData(){
 if(flashSet==="hira")return hira.map(x=>({q:x[0],a:x[1],id:"h:"+x[0]}));
 if(flashSet==="kata")return kata.map(x=>({q:x[0],a:x[1],id:"k:"+x[0]}));
 return words.map(x=>({q:x[0],a:x[3],id:"w:"+x[0]}));
}
function stat(id){return stats[id]||{r:0,w:0}}
function mark(id,correct){let s=stat(id);correct?s.r++:s.w++;stats[id]=s;localStorage.jwStats=JSON.stringify(stats)}
function renderFlash(){
 const data=flashData(),item=data[flashIndex%data.length],s=stat(item.id);
 const options=[item.a,...data.filter(x=>x.id!==item.id).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.a)].sort(()=>Math.random()-.5);
 document.getElementById("flashCard").innerHTML=`
 <div class="flash-top"><span>FLASHCARD • ${flashSet==="words"?"WORDS":flashSet.toUpperCase()}</span><span>✓ ${s.r} &nbsp; × ${s.w}</span></div>
 <div class="flash-prompt"><div class="flash-kind">What is this?</div><div class="flash-big">${item.q}</div><div class="flash-answer" id="flashAnswer">${flashAnswered?item.a:""}</div></div>
 <div class="section-title">ANSWER MODE</div>
 <div class="voice" style="grid-template-columns:repeat(3,1fr)">
 <button class="${flashType==="choice"?"active":""}" onclick="setFlashType('choice')">Multiple choice</button>
 <button class="${flashType==="typing"?"active":""}" onclick="setFlashType('typing')">Typing</button>
 <button class="${flashType==="speech"?"active":""}" onclick="setFlashType('speech')">Speech</button></div>
 <div id="flashInput" style="margin-top:9px">${flashType==="choice"?`<div class="choices">${options.map(o=>`<button onclick="answerChoice('${escapeAttr(o)}','${escapeAttr(item.a)}','${item.id}')">${escapeHtml(o)}</button>`).join("")}</div>`:flashType==="typing"?`<input id="typeAnswer" class="typebox" placeholder="Type the answer"><button class="submit" style="width:100%;margin-top:8px" onclick="answerTyping('${item.id}','${escapeAttr(item.a)}')">Check answer</button>`:`<button class="submit" style="width:100%" onclick="speechAnswer('${item.id}','${escapeAttr(item.a)}')">🎙️ Speak your answer</button>`}</div>
 <div class="flash-actions"><button onclick="nextFlash()">Skip</button><button onclick="revealFlash('${item.id}')">Reveal</button></div>
 <div class="selectbox"><label>FLASHCARD SET</label><select onchange="flashSet=this.value;flashIndex=0;flashAnswered=false;renderFlash()"><option value="words" ${flashSet==="words"?"selected":""}>Japanese words</option><option value="hira" ${flashSet==="hira"?"selected":""}>Hiragana</option><option value="kata" ${flashSet==="kata"?"selected":""}>Katakana</option></select></div>
 <div class="small-note">Correct and wrong answers are saved on this device for each item.</div>`;
}
function setFlashType(t){flashType=t;flashAnswered=false;renderFlash()}
function revealFlash(id){flashAnswered=true;renderFlash()}
function nextFlash(){flashIndex++;flashAnswered=false;themeIndex++;renderFlash();themeApply()}
function answerChoice(choice,answer,id){let ok=choice===answer;mark(id,ok);flashAnswered=true;renderFlash();setTimeout(()=>nextFlash(),850)}
function answerTyping(id,answer){let v=(document.getElementById("typeAnswer").value||"").trim().toLowerCase();let ok=v===answer.toLowerCase();mark(id,ok);flashAnswered=true;renderFlash();setTimeout(()=>nextFlash(),850)}
function speechAnswer(id,answer){
 if(!("webkitSpeechRecognition" in window)){alert("Speech recognition is not available in this browser. Try Typing or Multiple choice.");return}
 const R=window.webkitSpeechRecognition;const r=new R();r.lang="ja-JP";r.interimResults=false;r.maxAlternatives=3;
 r.onresult=e=>{let said=[...e.results[0]].map(x=>x.transcript.toLowerCase());let ok=said.some(x=>x.includes(answer.toLowerCase())||answer.toLowerCase().includes(x));mark(id,ok);flashAnswered=true;renderFlash();setTimeout(()=>nextFlash(),850)};
 r.onerror=()=>alert("I couldn't hear that. Try again or use Typing.");r.start()
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escapeAttr(s){return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
function openStats(){
 const vals=Object.values(stats),right=vals.reduce((n,s)=>n+s.r,0),wrong=vals.reduce((n,s)=>n+s.w,0);
 document.getElementById("statsText").textContent=`${right+wrong} answers recorded • ${right} correct • ${wrong} wrong.`;
 document.getElementById("statsList").innerHTML=words.map(w=>{let s=stat("w:"+w[0]);return `<div style="padding:9px 0;border-bottom:1px solid #ffffff18"><b>${w[0]}</b> ${w[3]} <span style="float:right;color:#c7cbd5">✓${s.r} ×${s.w}</span></div>`}).join("");
 document.getElementById("modal").classList.remove("hidden")
}
function closeStats(){document.getElementById("modal").classList.add("hidden")}
themeApply();renderLearn();setInterval(auto,30000);
</script>
