*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;overflow-x:hidden}
.app{min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 15px max(28px,env(safe-area-inset-bottom));background:linear-gradient(145deg,var(--bg),var(--bg2));transition:background .5s}

.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px}

.nav button.active{background:var(--accent);color:#1d1820;border-color:transparent}
.card{position:relative;overflow:hidden;border:1px solid #ffffff2b;border-radius:30px;padding:23px 19px 20px;background:linear-gradient(145deg,#ffffff0d,#00000010),var(--card);box-shadow:0 22px 60px #0008,0 0 24px var(--glow);transition:.5s}

.subchar{font-size:22px;margin-top:10px}.roman{font-size:15px;color:var(--muted);font-style:italic;margin-top:4px}
.meaning{font-size:29px;line-height:1.1;font-weight:900;margin-top:23px;color:#fff}
.example{margin-top:25px;padding-top:16px;border-top:1px solid #ffffff2b}.jp{font-size:18px}.en{font-size:14px;color:var(--muted);margin-top:5px}
.voice-title,.section-title{font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:900;margin-top:19px}.voice{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px}
button{font:inherit}.voice button,.action button,.flash-btn,.mode-btn,.submit{border:0;border-radius:13px;padding:12px 7px;background:#fff;color:#171922;font-size:12px;font-weight:900;min-height:46px}.voice button.active{background:var(--accent);color:#241923;outline:2px solid #fff;outline-offset:1px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.actions button:last-child{background:#ffffff18;color:#fff;border:1px solid #ffffff30}
.selectbox{margin-top:11px;border:1px solid #ffffff2b;border-radius:16px;padding:12px;background:#0002}.selectbox label{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.1em;display:block;margin-bottom:7px}.selectbox select{width:100%;padding:11px;border-radius:11px;border:0;background:#fff;color:#161821;font-size:14px;font-weight:700}
.bottom{margin-top:12px}.bottom{display:grid;grid-template-columns:1fr auto;gap:8px}.bottom button{width:100%;border:1px solid #ffffff33;border-radius:15px;background:#ffffff12;color:#fff;padding:14px;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{padding:10px;border:1px solid #ffffff20;border-radius:12px;text-align:center;background:#0002}.stat b{display:block;font-size:18px}.stat span{font-size:9px;color:var(--muted);font-weight:800}
.hidden{display:none!important}.fade{animation:fade .42s ease}@keyframes fade{from{opacity:.05;transform:translateY(7px)}to{opacity:1;transform:none}}

.scene{position:absolute!important;inset:0!important;overflow:hidden!important;pointer-events:none!important;z-index:0!important;opacity:.72}
.scene svg{width:100%;height:100%;display:block}.card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0b0e18aa 0%,#0b0e1822 42%,#0b0e18b8 100%);z-index:1}
.scene .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.scene .fine{opacity:.55}
.scene .wash{opacity:.18}
.scene .grain{opacity:.08}

.sentence-tools{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.sentence-tools button{border:1px solid #ffffff28;background:#ffffff12;color:#fff;border-radius:11px;padding:9px 8px;font-size:11px;font-weight:850}
.sentence-tools button:active{transform:scale(.98)}

.stats-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 18px}
.stats-summary>div{background:#ffffff0b;border:1px solid #ffffff12;border-radius:12px;padding:9px 5px;text-align:center}
.stats-summary b{display:block;font-size:18px}.stats-summary span{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.stats-group{font-size:11px;letter-spacing:.12em;font-weight:900;color:var(--accent);text-transform:uppercase;padding:12px 0 6px}.stats-group span{float:right;font-size:9px;letter-spacing:.04em;color:var(--muted);text-transform:none}
.stat-row{padding:10px 0;border-bottom:1px solid #ffffff12}.stat-name{display:flex;justify-content:space-between;gap:10px;align-items:center}.stat-name strong{font-size:13px}.stat-name span{font-size:10px;color:var(--muted)}
.stat-counts{display:flex;gap:8px;margin-top:6px;font-size:10px}.stat-counts span{padding:4px 7px;border-radius:7px;background:#ffffff09}.stat-counts .correct{color:#9ce0b6}.stat-counts .wrong{color:#f0a5ad}
.flash-listen{margin-top:7px}.hear-card{width:100%;border:1px solid #ffffff2b;background:#ffffff12;color:#fff;border-radius:12px;padding:11px;font-weight:850}.flash-feedback{margin-top:12px;border-radius:16px;padding:14px 15px;text-align:center;border:1px solid #ffffff26;background:#0003}
.flash-feedback.correct{background:#2d8b5a33;border-color:#71d49b77}.flash-feedback.revealed{background:#ffffff0d;border-color:#ffffff33}
.flash-feedback.wrong{background:#a6424b33;border-color:#ef929a77}
.feedback-title{font-size:18px;font-weight:900}
.feedback-answer{margin-top:4px;color:#eef0f5;font-size:14px}
.continue{width:100%;margin-top:9px;border:0;border-radius:13px;padding:13px;background:var(--accent);color:#211923;font-weight:900}
.reset-stats{background:#ffffff08!important;color:#f0a5ad!important;border-color:#f0a5ad33!important}.small-note{text-align:center;color:var(--muted);font-size:10px;margin-top:10px}
.modal{position:fixed;inset:0;background:#0009;backdrop-filter:blur(12px);display:flex;align-items:flex-end;z-index:5}.sheet{width:100%;background:#202536;color:#fff;border-radius:25px 25px 0 0;padding:22px 18px max(22px,env(safe-area-inset-bottom));max-height:82vh;overflow:auto}.sheet h2{margin:0 0 10px}.sheet p{color:var(--muted);font-size:13px}.close{float:right;border:0;background:#ffffff18;color:#fff;border-radius:50%;width:36px;height:36px;font-size:18px}
@media(min-width:700px){.app{max-width:700px;margin:auto}.card{min-height:680px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">日本語 • DAILY</div><div class="theme" id="themeName"></div></div>

  <div class="nav">
    <button id="navWords" class="active" onclick="setSection('words')">Words</button>
    <button id="navHira" onclick="setSection('hiragana')">ひらがな</button>
    <button id="navKata" onclick="setSection('katakana')">カタカナ</button>
    <button id="navNumbers" onclick="setSection('numbers')">Numbers</button>
    <button id="navFlash" onclick="setSection('flash')">Flashcards</button>
  </div>

  <section id="learnCard" class="card"><div class="scene" id="scene" aria-hidden="true"></div>
    <div class="scene-badge" id="sceneBadge"></div>
    <div class="kicker" id="category"></div>
    <div class="mainchar" id="mainchar"></div>
    <div class="subchar" id="subchar"></div>
    <div class="roman" id="roman"></div>
    <div class="meaning" id="meaning"></div>
    <div class="example">
      <div class="jp" id="example"></div>
      <div class="en" id="exampleEn"></div>
      <div class="sentence-tools">
        <button id="sentenceScriptBtn" onclick="toggleSentenceScript()">あ Hiragana</button>
        <button onclick="speakSentence()">🔊 Sentence</button>
      </div>
    </div>

    <div class="voice-title">PRONUNCIATION</div>
    <div class="voice">
      <button class="active" data-mode="regular" onclick="speak('regular')">▶ Normal</button>
      <button data-mode="slow" onclick="speak('slow')">▶ ½ Speed</button>
      <button data-mode="syllable" onclick="speak('syllable')">▶ Syllable</button>
    </div>
    <div class="actions"><button onclick="nextLearning()" style="grid-column:1/-1">Next</button></div>
    <div class="selectbox">
      <label>WORD ROTATION</label>
      <select id="interval" onchange="saveSettings()">
        <option value="1">Every hour</option><option value="2">Every 2 hours</option>
        <option value="4" selected>Every 4 hours</option><option value="6">Every 6 hours</option><option value="12">Every 12 hours</option>
      </select>
    </div>
    <div class="bottom"><button onclick="openStats()">📊 My progress</button><button onclick="resetStats()" class="reset-stats">Reset stats</button></div>
  </section>

  <section id="flashCard" class="card flash hidden"></section>
  <div class="small-note">Themes, vocabulary, and progress stay on this device.</div>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target.id==='modal')closeStats()">
  <div class="sheet"><button class="close" onclick="closeStats()">×</button><h2>My progress</h2><p id="statsText"></p><div id="statsList"></div></div>
</div>

}
const kanjiReadings={
"桜":"さくら","乾杯":"かんぱい","日本":"にほん","今日":"きょう","電車":"でんしゃ","友達":"ともだち","猫":"ねこ","水":"みず","家":"いえ","山":"やま","犬":"いぬ","好き":"すき","行く":"いく","見る":"みる","大丈夫":"だいじょうぶ","星":"ほし","空":"そら","雨":"あめ","雪":"ゆき","海":"うみ","魚":"さかな","ご飯":"ごはん","お茶":"おちゃ","野菜":"やさい","果物":"くだもの","朝":"あさ","夜":"よる","今":"いま","明日":"あした","昨日":"きのう","時間":"じかん","人":"ひと","先生":"せんせい","学生":"がくせい","家族":"かぞく","子供":"こども","名前":"なまえ","東京":"とうきょう","京都":"きょうと","大阪":"おおさか","北海道":"ほっかいどう","沖縄":"おきなわ","駅":"えき","学校":"がっこう","空港":"くうこう","車":"くるま","自転車":"じてんしゃ","歩く":"あるく","走る":"はしる","読む":"よむ","書く":"かく","聞く":"きく","話す":"はなす","買う":"かう","使う":"つかう","作る":"つくる","寝る":"ねる","起きる":"おきる","大きい":"おおきい","小さい":"ちいさい","新しい":"あたらしい","古い":"ふるい","暑い":"あつい","寒い":"さむい","楽しい":"たのしい","右":"みぎ","左":"ひだり","上":"うえ","下":"した","中":"なか","外":"そと","一緒":"いっしょ","本当":"ほんとう","分かる":"わかる","分からない":"わからない","温泉":"おんせん"};
function toHiragana(text){
 let out=text;
 Object.keys(kanjiReadings).sort((a,b)=>b.length-a.length).forEach(k=>{out=out.split(k).join(kanjiReadings[k])});
 return out.replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
}
function toggleSentenceScript(){
 sentenceMode=sentenceMode==="hiragana"?"japanese":"hiragana";
 localStorage.jwSentenceMode=sentenceMode;
 renderLearn();
}
function speakSentence(){
 if(section!=="words")return;
 const text=words[index%words.length][4];
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="ja-JP";u.rate=.68;
 speechSynthesis.speak(u);
}
function nextLearning(){index++;themeIndex++;renderLearn()}
function saveSettings(){hours=+document.getElementById("interval").value;localStorage.jwHours=hours}
function speak(mode){
 currentVoice=mode;localStorage.jwVoice=mode;
 document.querySelectorAll(".voice button").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
 let text=section==="words"?words[index%words.length][1]:(section==="numbers"?numbers[index%numbers.length][1]:(section==="hiragana"?hira[index%hira.length][0]:kata[index%kata.length][0]));
 speechSynthesis.cancel();
 if(mode==="syllable"){
  [...text].forEach((ch,i)=>setTimeout(()=>{let u=new SpeechSynthesisUtterance(ch);u.lang="ja-JP";u.rate=.48;speechSynthesis.speak(u)},i*650));
 }else{let u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=mode==="slow"?.30:.82;speechSynthesis.speak(u)}
}
function auto(){if(section!=="flash"&&Date.now()-Number(localStorage.jwLast||0)>=hours*3600000)nextLearning()}

function flashData(){
 if(flashSet==="hira")return hira.map(x=>({q:x[0],a:x[1],id:"h:"+x[0]}));
 if(flashSet==="kata")return kata.map(x=>({q:x[0],a:x[1],id:"k:"+x[0]}));
 if(flashSet==="numbers")return numbers.map(x=>({q:x[0],a:x[3]+" — "+x[1],id:"n:"+x[0]}));
 return words.map(x=>({q:x[0],a:x[3],id:"w:"+x[0]}));
}
function stat(id){return stats[id]||{r:0,w:0}}
function mark(id,correct){let s=stat(id);correct?s.r++:s.w++;stats[id]=s;localStorage.jwStats=JSON.stringify(stats)}
function renderFlash(){
 const data=flashData(),item=data[flashIndex%data.length],s=stat(item.id);
 const options=[item.a,...data.filter(x=>x.id!==item.id).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.a)].sort(()=>Math.random()-.5);
 const f=document.getElementById("flashCard");
 let feedback="";
 if(flashAnswered){
   const ok=flashAnswered.correct;
   feedback=`<div class="flash-feedback ${ok?"correct":"wrong"}">
     <div class="feedback-title">${ok?"✓ Correct!":"✕ Not quite"}</div>
     <div class="feedback-answer">${ok?"":"Correct answer: "}<strong>${escapeHtml(item.a)}</strong></div>
     <button class="continue" onclick="nextFlash()">Next card →</button>
   </div>`;
 }
 f.innerHTML=`
 <div class="flash-top"><span>FLASHCARD • ${flashSet==="words"?"WORDS":flashSet==="hira"?"HIRAGANA":flashSet==="kata"?"KATAKANA":"NUMBERS"}</span><span>✓ ${s.r} &nbsp; × ${s.w}</span></div>
 <div class="flash-prompt"><div class="flash-kind">What is this?</div><div class="flash-big">${escapeHtml(item.q)}</div>${flashAnswered?`<div class="flash-answer">${escapeHtml(item.a)}</div>`:""}</div>
 <div class="flash-listen"><button class="hear-card" onclick="speakFlash()">🔊 Hear this card</button></div>
 <div class="section-title">ANSWER MODE</div>
 <div class="voice" style="grid-template-columns:repeat(3,1fr)">
 <button class="${flashType==="choice"?"active":""}" onclick="setFlashType('choice')">Multiple choice</button>
 <button class="${flashType==="typing"?"active":""}" onclick="setFlashType('typing')">Typing</button>
 <button class="${flashType==="speech"?"active":""}" onclick="setFlashType('speech')">Speech</button></div>
 <div id="flashInput" style="margin-top:9px">${flashAnswered?feedback:flashType==="choice"?`<div class="choices">${options.map(o=>`<button onclick="answerChoice('${escapeAttr(o)}','${escapeAttr(item.a)}','${item.id}')">${escapeHtml(o)}</button>`).join("")}</div>`:flashType==="typing"?`<input id="typeAnswer" class="typebox" placeholder="Type the answer"><button class="submit" style="width:100%;margin-top:8px" onclick="answerTyping('${item.id}','${escapeAttr(item.a)}')">Check answer</button>`:`<button class="submit" style="width:100%" onclick="speechAnswer('${item.id}','${escapeAttr(item.a)}')">🎙️ Speak your English answer</button>`}</div>
 ${flashAnswered?"":`<div class="flash-actions"><button onclick="nextFlash()">Skip</button><button onclick="revealFlash('${item.id}')">Reveal answer</button></div>`}

 <div class="selectbox"><label>FLASHCARD SET</label><select onchange="flashSet=this.value;flashIndex=0;flashAnswered=false;renderFlash()"><option value="words" ${flashSet==="words"?"selected":""}>Japanese words</option><option value="hira" ${flashSet==="hira"?"selected":""}>Hiragana</option><option value="kata" ${flashSet==="kata"?"selected":""}>Katakana</option><option value="numbers" ${flashSet==="numbers"?"selected":""}>Numbers</option></select></div>
 <div class="small-note">Your correct/incorrect count is saved separately for each item.</div>`;
}

function speakFlash(){
 const data=flashData(),item=data[flashIndex%data.length];
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(item.q);
 u.lang="ja-JP";u.rate=.78;
 speechSynthesis.speak(u);
}
function setFlashType(t){flashType=t;flashAnswered=false;renderFlash()}
function revealFlash(id){flashAnswered={correct:false,revealed:true};renderFlash()}
function nextFlash(){flashIndex++;flashAnswered=false;themeIndex++;renderFlash();themeApply()}
function answerChoice(choice,answer,id){let ok=choice===answer;mark(id,ok);flashAnswered={correct:ok};renderFlash()}
function answerTyping(id,answer){let v=(document.getElementById("typeAnswer").value||"").trim().toLowerCase();let ok=v===answer.toLowerCase();mark(id,ok);flashAnswered={correct:ok};renderFlash()}
function speechAnswer(id,answer){
 if(!("webkitSpeechRecognition" in window)){alert("Speech recognition is not available in this browser. Try Typing or Multiple choice.");return}
 const R=window.webkitSpeechRecognition;const r=new R();r.lang="en-US";r.interimResults=false;r.maxAlternatives=3;
 r.onresult=e=>{let said=[...e.results[0]].map(x=>x.transcript.toLowerCase());let ok=said.some(x=>x.includes(answer.toLowerCase())||answer.toLowerCase().includes(x));mark(id,ok);flashAnswered={correct:ok};renderFlash()};
 r.onerror=()=>alert("I couldn't hear that. Try again or use Typing.");r.start()
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escapeAttr(s){return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
function resetStats(){
 if(!confirm("Reset all learning statistics?\n\nThis will erase every correct/incorrect count for words, Hiragana, Katakana, and numbers.")) return;
 stats={};localStorage.removeItem("jwStats");openStats();
}
function statLine(label,id){
 const s=stat(id),total=s.r+s.w,accuracy=total?Math.round((s.r/total)*100):0;
 return `<div class="stat-row"><div class="stat-name"><strong>${escapeHtml(label)}</strong><span>${total?accuracy+"% accuracy • "+total+" attempt"+(total===1?"":"s"):"Not practiced yet"}</span></div><div class="stat-counts"><span class="correct">✓ ${s.r} correct</span><span class="wrong">× ${s.w} wrong</span></div></div>`;
}
function openStats(){
 const all=[];
 words.forEach(w=>all.push({group:"Vocabulary",label:`${w[0]} — ${w[3]}`,id:"w:"+w[0]}));
 hira.forEach(w=>all.push({group:"Hiragana",label:`${w[0]} — ${w[1]}`,id:"h:"+w[0]}));
 kata.forEach(w=>all.push({group:"Katakana",label:`${w[0]} — ${w[1]}`,id:"k:"+w[0]}));
 numbers.forEach(w=>all.push({group:"Numbers",label:`${w[0]} — ${w[3]}`,id:"n:"+w[0]}));
 const vals=Object.values(stats),right=vals.reduce((n,s)=>n+s.r,0),wrong=vals.reduce((n,s)=>n+s.w,0),total=right+wrong;
 const accuracy=total?Math.round(right/total*100):0;
 document.getElementById("statsText").innerHTML=`<div class="stats-summary"><div><b>${total}</b><span>Total attempts</span></div><div><b>${right}</b><span>Correct</span></div><div><b>${wrong}</b><span>Wrong</span></div><div><b>${accuracy}%</b><span>Accuracy</span></div></div>`;
 let out="",current="";
 all.forEach(x=>{
   if(x.group!==current){current=x.group;const practiced=all.filter(y=>y.group===current&&((stats[y.id]?.r||0)+(stats[y.id]?.w||0)>0)).length;const groupTotal=all.filter(y=>y.group===current).length;out+=`<div class="stats-group">${current}<span>${practiced}/${groupTotal} practiced</span></div>`}
   out+=statLine(x.label,x.id);
 });
 document.getElementById("statsList").innerHTML=out;
 document.getElementById("modal").classList.remove("hidden");
}
function closeStats(){document.getElementById("modal").classList.add("hidden")}
themeApply();renderLearn();setInterval(auto,30000);
</script>
</body>
</html>
