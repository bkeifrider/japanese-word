<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日本語">
<link rel="manifest" href="manifest.json">
<title>日本語 • Daily Japanese</title>
<style>
:root{
 --bg:#171b2b;--bg2:#202941;--card:#283149;--ink:#fffdf9;--muted:#d7d9e2;
 --accent:#f0a6bb;--accent2:#89a8dd;--accentText:#241923;--glow:#f0a6bb66;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;overflow-x:hidden}
.app{
 min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
 background:
 radial-gradient(circle at 8% 4%,var(--accent)55 0 9%,transparent 28%),
 radial-gradient(circle at 96% 94%,var(--accent2)55 0 10%,transparent 31%),
 linear-gradient(145deg,var(--bg),var(--bg2));
 transition:background .55s ease;
}
.app:before,.app:after{content:"";position:fixed;pointer-events:none;border-radius:50%;filter:blur(4px);opacity:.18}
.app:before{width:180px;height:180px;left:-85px;top:34%;background:var(--accent)}
.app:after{width:220px;height:220px;right:-110px;top:16%;background:var(--accent2)}
.top{display:flex;justify-content:space-between;align-items:center;padding:5px 3px 15px}
.brand{font-weight:900;letter-spacing:.13em;font-size:13px}
.themeName{font-size:12px;color:var(--muted);font-weight:700}
.card{
 min-height:74vh;border:1px solid #ffffff2b;border-radius:32px;padding:24px 20px 20px;
 background:linear-gradient(145deg,#ffffff1c,#00000022),var(--card);
 box-shadow:0 28px 75px #0008,0 0 45px var(--glow);
 position:relative;overflow:hidden;transition:background .55s ease,box-shadow .55s ease;
}
.card:before{content:"";position:absolute;inset:-50% -30%;background:var(--pattern);opacity:.12;transform:rotate(-12deg);pointer-events:none}
.card>*{position:relative}
.motif{position:absolute!important;right:-4px;top:-27px;font-size:126px;line-height:1;opacity:.22;filter:drop-shadow(0 8px 20px #0006);transform:rotate(8deg);transition:.55s}
.stamp{
 position:absolute;right:18px;bottom:18px;width:54px;height:54px;border:2px solid #ffffff55;border-radius:50%;
 display:grid;place-items:center;color:#fff9;font-family:Georgia,serif;font-size:15px;transform:rotate(-8deg);
}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;font-weight:800}
.kanji{font-family:Georgia,"Times New Roman",serif;font-size:clamp(70px,20vw,112px);font-weight:700;line-height:1;margin-top:53px;text-shadow:0 7px 28px #0008}
.kana{font-size:22px;margin-top:10px;color:#fff}
.romaji{font-size:15px;color:var(--muted);margin-top:4px;font-style:italic}
.english{font-size:30px;line-height:1.12;font-weight:900;margin-top:24px;max-width:92%;color:#fff}
.example{margin-top:27px;border-top:1px solid #ffffff2b;padding-top:17px}
.jp{font-size:18px;color:#fff}.en{font-size:14px;color:var(--muted);margin-top:5px}
.voice-label{margin-top:20px;font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:800}
.voice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
button{border:0;border-radius:14px;padding:13px 7px;background:#ffffffea;color:#151722;font-size:13px;font-weight:850;min-height:48px;box-shadow:0 5px 16px #0003}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);color:var(--accentText)}
.voice.active{outline:2px solid #fff;outline-offset:2px;background:var(--accent);color:var(--accentText)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.actions button:first-child{background:#fff;color:#161923}
.actions button:last-child{background:#ffffff18;color:#fff;border:1px solid #ffffff2b}
.panel{margin-top:12px;border:1px solid #ffffff2b;border-radius:17px;padding:13px;background:#0000001c}
.panel label{font-size:11px;color:var(--muted);display:block;margin-bottom:7px;font-weight:800;letter-spacing:.08em}
.panel select{width:100%;border:0;border-radius:11px;padding:12px;background:#fff;color:#161923;font-size:15px;font-weight:650}
.dots{display:flex;gap:5px;justify-content:center;margin:17px 0 0;flex-wrap:wrap;max-width:270px;margin-left:auto;margin-right:auto}
.dot{width:6px;height:6px;border-radius:50%;background:#fff4}.dot.on{background:var(--accent);box-shadow:0 0 9px var(--accent)}
.footer{text-align:center;color:var(--muted);font-size:11px;margin:13px 12px 0}
.fade{animation:fade .48s ease}@keyframes fade{from{opacity:.05;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
@media(min-width:700px){.app{max-width:680px;margin:auto}.card{min-height:700px}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top"><div class="brand">日本語 • DAILY</div><div class="themeName" id="themeName"></div></div>
  <section class="card" id="card">
    <div class="motif" id="motif"></div>
    <div class="kicker" id="category"></div>
    <div class="kanji" id="kanji"></div>
    <div class="kana" id="kana"></div>
    <div class="romaji" id="romaji"></div>
    <div class="english" id="english"></div>
    <div class="example"><div class="jp" id="example"></div><div class="en" id="exampleEn"></div></div>

    <div class="voice-label">PRONUNCIATION</div>
    <div class="voice-grid">
      <button class="voice active" data-mode="regular" onclick="speak('regular')">Normal</button>
      <button class="voice" data-mode="slow" onclick="speak('slow')">½ Speed</button>
      <button class="voice" data-mode="syllable" onclick="speak('syllable')">Syllable</button>
    </div>

    <div class="actions">
      <button class="primary" onclick="nextWord()">Next word</button>
      <button onclick="speak(currentMode)">🔊 Hear again</button>
    </div>

    <div class="panel">
      <label>WORD ROTATION</label>
      <select id="interval" onchange="saveSettings()">
        <option value="1">Every hour</option>
        <option value="2">Every 2 hours</option>
        <option value="4" selected>Every 4 hours</option>
        <option value="6">Every 6 hours</option>
        <option value="12">Every 12 hours</option>
      </select>
    </div>

    <div class="dots" id="dots"></div>
    <div class="stamp" id="stamp">桜</div>
  </section>
  <div class="footer">Each new word also brings a new Japanese scene.</div>
</div>

 document.getElementById("kanji").textContent=w[0];
 document.getElementById("kana").textContent=w[1];
 document.getElementById("romaji").textContent=w[2];
 document.getElementById("english").textContent=w[3];
 document.getElementById("example").textContent=w[4];
 document.getElementById("exampleEn").textContent=w[5];
 document.getElementById("category").textContent=w[6];
 document.getElementById("dots").innerHTML=themes.map((_,i)=>`<span class="dot ${i===themeIndex%themes.length?"on":""}"></span>`).join("");
 document.querySelectorAll(".voice").forEach(b=>b.classList.toggle("active",b.dataset.mode===currentMode));
 applyTheme();
 localStorage.jwIndex=index;localStorage.jwTheme=themeIndex;localStorage.jwLast=Date.now();
}
function nextWord(){
 index=(index+1)%words.length;
 themeIndex=(themeIndex+1)%themes.length;
 render();
}
function saveSettings(){
 hours=Number(document.getElementById("interval").value);
 localStorage.jwHours=hours;
}
function setMode(mode){
 currentMode=mode;localStorage.jwVoice=mode;
 document.querySelectorAll(".voice").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
}
function speak(mode){
 setMode(mode);
 const text=words[index][1];
 speechSynthesis.cancel();
 if(!("speechSynthesis" in window)){alert("Speech is not available in this browser.");return}
 if(mode==="syllable"){
   // Break kana into mora-like units and speak each with a short pause.
   const units=[...text].reduce((arr,ch)=>{
     const small="ゃゅょぁぃぅぇぉァィゥェォャュョ";
     if(small.includes(ch)&&arr.length) arr[arr.length-1]+=ch; else arr.push(ch);
     return arr;
   },[]);
   let i=0;
   const play=()=>{
     if(i>=units.length)return;
     const u=new SpeechSynthesisUtterance(units[i++]);
     u.lang="ja-JP";u.rate=.55;u.pitch=1;
     u.onend=()=>setTimeout(play,170);
     speechSynthesis.speak(u);
   };
   play();
 } else {
   const u=new SpeechSynthesisUtterance(text);
   u.lang="ja-JP";u.rate=mode==="slow"?.45:.9;u.pitch=1;
   speechSynthesis.speak(u);
 }
}
function auto(){
 if(Date.now()-Number(localStorage.jwLast||0)>=hours*3600000)nextWord();
}
render();
setInterval(auto,30000);
</script>
</body>
</html>
